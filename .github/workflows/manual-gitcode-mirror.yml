name: Manual GitCode Mirror

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: Repository name to mirror
        required: true
        type: string

jobs:
  create-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitCode mirror repo
        env:
          GITCODE_ORG: hd-vector
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          REPO_NAME: ${{ inputs.repo_name }}
        run: |
          python3 -c "
import json, os, urllib.request, urllib.error
token = os.environ.get('GITCODE_TOKEN', '')
org = os.environ.get('GITCODE_ORG', 'hd-vector')
name = os.environ.get('REPO_NAME', '')
if not token or not name:
    print('Missing token or repo name')
    exit(1)
url = f'https://api.gitcode.com/api/v5/orgs/{org}/repos'
data = json.dumps({'name': name, 'path': name, 'description': f'Mirror of huaweicloud-mate/{name}', 'private': False}).encode()
req = urllib.request.Request(url, data=data, headers={'PRIVATE-TOKEN': token, 'Content-Type': 'application/json'}, method='POST')
try:
    with urllib.request.urlopen(req, timeout=30) as resp:
        result = json.loads(resp.read())
        print(f'GitCode repo created: {result.get(\"html_url\", \"\")}')
except urllib.error.HTTPError as e:
    err = e.read().decode()[:500]
    print(f'Failed: {e.code} {err}')
    if e.code == 409:
        print('Repo may already exist, trying to verify...')
"
      - name: Verify mirror
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          REPO_NAME: ${{ inputs.repo_name }}
        run: |
          python3 -c "
import json, os, urllib.request
token = os.environ.get('GITCODE_TOKEN', '')
name = os.environ.get('REPO_NAME', '')
url = f'https://api.gitcode.com/api/v5/orgs/hd-vector/repos/{name}'
req = urllib.request.Request(url, headers={'PRIVATE-TOKEN': token})
try:
    with urllib.request.urlopen(req, timeout=30) as resp:
        r = json.loads(resp.read())
        print(f'Verified: {r.get(\"html_url\", \"\")}')
except Exception as e:
    print(f'Verify failed: {e}')
"