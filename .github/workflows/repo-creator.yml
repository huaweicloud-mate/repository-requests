name: Repository Creator

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read

jobs:
  create-repo:
    if: contains(github.event.issue.labels.*.name, 'request/create-repo')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Repository Creator Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          ORG_NAME: huaweicloud-mate
        run: python3 scripts/repo_creator.py
