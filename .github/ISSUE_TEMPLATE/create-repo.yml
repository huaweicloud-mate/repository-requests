name: 🏗️ 新建仓库申请
description: 申请在 huaweicloud-mate 组织下创建新仓库
labels: ["status/pending"]
body:
  - type: markdown
    attributes:
      value: |
        ## 新建仓库申请
        
        填写以下信息来申请在 `huaweicloud-mate` 组织下创建新仓库。
        
        提交后，管理员审核通过后将自动创建仓库。

  - type: input
    id: repo-name
    attributes:
      label: 仓库名称
      description: 仓库的名称（仅小写字母、数字和连字符，如 my-awesome-project）
      placeholder: my-awesome-project
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 仓库描述
      description: 简要描述仓库的用途和内容
      placeholder: 这个仓库用于...
    validations:
      required: true

  - type: dropdown
    id: visibility
    attributes:
      label: 可见性
      description: 仓库的可见性设置
      options:
        - public
        - private
      default: 0
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: 主要编程语言
      options:
        - Python
        - TypeScript
        - Go
        - Java
        - Rust
        - C++
        - Shell
        - Other
      default: 0
    validations:
      required: true

  - type: dropdown
    id: license
    attributes:
      label: 开源许可证
      description: 仓库使用的开源许可证
      options:
        - Apache-2.0
        - MIT
        - GPL-3.0
        - BSD-3-Clause
        - 无
      default: 0
    validations:
      required: true

  - type: textarea
    id: topics
    attributes:
      label: 仓库标签（Topics）
      description: 用逗号分隔的标签，用于分类和搜索
      placeholder: sdk, api, evaluation

  - type: textarea
    id: justification
    attributes:
      label: 申请理由
      description: 为什么需要创建这个仓库？它解决什么问题？
      placeholder: 这个仓库将用于...
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 仓库名称符合命名规范（小写字母、数字、连字符）
          required: true
        - label: 我已确认组织内不存在同名仓库
          required: true
        - label: 我了解创建的仓库将遵循组织的社区治理规范
          required: true