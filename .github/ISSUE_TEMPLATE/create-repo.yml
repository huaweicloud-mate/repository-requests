name: "New Repo Request"
description: "Request creating a new repo in huaweicloud-mate"
labels: ["status/pending"]
body:
  - type: markdown
    attributes:
      value: "## New Repository Request"

  - type: input
    id: repo_type
    attributes:
      label: "Repo Type"
      description: "SDK / Terraform / Action / Framework / Exporter / IoT / Sample / Docs / Internal"
      placeholder: "SDK"
    validations:
      required: true

  - type: input
    id: repo_name
    attributes:
      label: "Repo Name"
      description: "lowercase, digits, hyphens only, <=100 chars"
      placeholder: "my-awesome-sdk"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "Brief description"
    validations:
      required: true

  - type: dropdown
    id: visibility
    attributes:
      label: "Visibility"
      options: ["public", "private"]
      default: 0
    validations:
      required: true

  - type: dropdown
    id: license
    attributes:
      label: "License"
      description: "Only product repos use user choice; others force Apache-2.0"
      options: ["Apache-2.0", "MIT", "BSD-3-Clause"]
      default: 0
    validations:
      required: true

  - type: textarea
    id: topics
    attributes:
      label: "Topics (>=3)"
      description: "Comma or newline separated"
      placeholder: "sdk, python, api"
    validations:
      required: true

  - type: textarea
    id: owner
    attributes:
      label: "Owner (admin, >=1 person)"
      description: "GitHub usernames, comma separated"
      placeholder: "alice, bob"
    validations:
      required: true

  - type: textarea
    id: maintainer
    attributes:
      label: "Maintainer (>=1 person)"
      description: "GitHub usernames, comma separated"
      placeholder: "charlie, dave"
    validations:
      required: true

  - type: textarea
    id: writer
    attributes:
      label: "Writer (optional)"
      placeholder: "eve"

  - type: textarea
    id: reason
    attributes:
      label: "Reason"
      description: "Why this repo is needed?"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "Repo name follows convention (lowercase, digits, hyphens, <=100 chars)"
          required: true
        - label: "No duplicate repo in org"
          required: true
        - label: "Owner and Maintainer are org members"
          required: true
        - label: "Topics >= 3"
          required: true
        - label: "Follow org governance"
          required: true
